[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vivian"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/", "tests/", "docs/",
  "README.md", "LICENSE",
  "pyproject.toml", "mkdocs.yml",
]

[project]
name = "vivian-net"
version = "0.1.0"
description = "Vivian: collection of 2D tensor network algorithms"
dynamic = ["readme"]
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Changkai Zhang", email = "c.zhang@ideogenesis.ai" }]
maintainers = [{ name = "Ideogenesis AI", email = "developer@ideogenesis.ai" }]
keywords = [
  "tensor-network", "ipeps", "peps", "ctmrg", "simple-update",
  "full-update", "quantum", "physics", "symmetry", "two-dimensional"
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "nicole>=0.4.0",
  "yuzuha>=0.1.6",
  "numpy>=2.0",
  "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/Ideogenesis-AI/Vivian"
Documentation = "https://ideogenesis-ai.github.io/Vivian"
Repository = "https://github.com/Ideogenesis-AI/Vivian"
Issues = "https://github.com/Ideogenesis-AI/Vivian/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "hypothesis>=6.0",
  "pytest-benchmark>=4.0",
]

lint = [
  "ruff>=0.6",
  "mypy>=1.8",
]

docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-material-extensions>=1.3",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mkdocs-git-committers-plugin-2>=2.0",
  "markdown-exec[ansi]>=1.12",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?:docs/images/)([\w.-]+\.png)'
replacement = 'https://raw.githubusercontent.com/Ideogenesis-AI/Vivian/stable/docs/images/\1'

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
